# SmolOfis core application stack.
#
# Launched by smolofis-infrastructure.service as `docker compose -p smolofis`.
# All persistent state lives under /var/lib/smolofis/ so the appliance can be
# re-imaged without losing repositories or deployment data.
#
# Secrets (database password, Coolify APP_KEY, ...) are generated once per
# device by /usr/local/bin/smolofis-firstboot into /etc/smolofis/secrets.env.
#
# Traefik is not defined here: it is Coolify's own proxy, started from
# /data/coolify/proxy/docker-compose.yml so that Coolify can manage it.

name: smolofis

services:
  # ---------------------------------------------------------------- Gitea --
  gitea:
    image: gitea/gitea:28.2.0
    container_name: smolofis-gitea
    restart: unless-stopped
    env_file:
      # Preset token that lets gitea-runner register itself.
      - /etc/smolofis/runner.env
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__DOMAIN: smolofis.local
      GITEA__server__ROOT_URL: http://smolofis.local:3000/
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      # Skip the install wizard: the runner cannot register until Gitea is set up.
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "3000:3000"   # web UI + API
      - "2222:22"     # git over ssh
    volumes:
      - /var/lib/smolofis/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------- Gitea Actions Runner --
  gitea-runner:
    image: gitea/act_runner:0.6.1
    container_name: smolofis-gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    env_file:
      - /etc/smolofis/runner.env
    environment:
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_NAME: smolofis-runner
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://node:22-bookworm,ubuntu-24.04:docker://node:22-bookworm"
      # Written by smolofis-firstboot; adds the smolofis.local host entry to job
      # containers so actions/checkout can reach Gitea's ROOT_URL.
      CONFIG_FILE: /data/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/smolofis/gitea-runner:/data

  # -------------------------------------------------------------- Coolify --
  coolify:
    image: docker.io/coollabsio/coolify:4.5.3
    container_name: smolofis-coolify
    restart: unless-stopped
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
    extra_hosts:
      # Coolify manages this machine over SSH through the Docker host gateway.
      - host.docker.internal:host-gateway
    networks:
      - default
      - coolify
    env_file:
      - /etc/smolofis/secrets.env
    environment:
      APP_ENV: production
      APP_NAME: SmolOfis Coolify
      APP_URL: http://smolofis.local:8000
      DB_CONNECTION: pgsql
      DB_HOST: coolify-db
      DB_PORT: "5432"
      DB_DATABASE: coolify
      DB_USERNAME: coolify
      REDIS_HOST: coolify-redis
      PHP_MEMORY_LIMIT: 256M
      SSL_MODE: "off"
      PUSHER_BACKEND_PORT: "6001"
    ports:
      - "8000:8080"   # Coolify UI/API
      - "6001:6001"   # realtime
      - "6002:6002"   # terminal
    volumes:
      # Coolify orchestrates deployments through the host engine.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount only the data subdirectories: storage/ itself must stay in the
      # image, because Laravel needs storage/framework to serve any request.
      - /var/lib/smolofis/coolify/ssh:/var/www/html/storage/app/ssh
      - /var/lib/smolofis/coolify/applications:/var/www/html/storage/app/applications
      - /var/lib/smolofis/coolify/databases:/var/www/html/storage/app/databases
      - /var/lib/smolofis/coolify/services:/var/www/html/storage/app/services
      - /var/lib/smolofis/coolify/backups:/var/www/html/storage/app/backups
      - /var/lib/smolofis/coolify/images:/var/www/html/storage/app/images
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health && curl -fsS http://localhost:6001/up"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  coolify-db:
    image: postgres:15.19-alpine
    container_name: smolofis-coolify-db
    restart: unless-stopped
    env_file:
      - /etc/smolofis/secrets.env
    environment:
      POSTGRES_USER: coolify
      POSTGRES_DB: coolify
      # POSTGRES_PASSWORD comes from secrets.env
    volumes:
      - /var/lib/smolofis/coolify/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify -d coolify"]
      interval: 10s
      timeout: 5s
      retries: 10

  coolify-redis:
    image: redis:7.4.12-alpine
    container_name: smolofis-coolify-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - /var/lib/smolofis/coolify/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # Shared with coolify-proxy and deployed apps; created by smolofis-firstboot.
  coolify:
    external: true
