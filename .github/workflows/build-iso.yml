# SmolOfis ISO pipeline.
#
# Every push to main (and any v* tag) compiles the Rust control panel as a
# fully static musl binary, bakes it into a Debian live image with
# scripts/build-image.sh, and publishes the flashable ISO — as a workflow
# artifact on every run, and as a GitHub Release on tags plus a rolling
# "nightly" prerelease on main.

name: Build SmolOfis ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # Build + smoke-test the ISO on PRs too; the release job stays gated to
  # main/tags (see its `if:`), so pull requests validate without publishing.
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  # A run on main may be publishing, so it always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-panel:
    name: Compile smolofis-panel (static musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust (stable + musl target)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-dashboard

      - name: Check formatting & lints
        working-directory: src-dashboard
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Check shell scripts
        run: shellcheck -S warning scripts/*.sh

      - name: Check dependency advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-dashboard/Cargo.toml
          command: check advisories

      # Run the suite on the host (gnu) target: the tests bind real TCP/unix
      # sockets and must actually execute, which the native target does without
      # the cross-run friction of the static musl build.
      - name: Run unit tests
        working-directory: src-dashboard
        run: cargo test --locked

      - name: Build release binary
        working-directory: src-dashboard
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Sanity-check binary is static
        run: |
          file src-dashboard/target/x86_64-unknown-linux-musl/release/smolofis-panel
          file src-dashboard/target/x86_64-unknown-linux-musl/release/smolofis-panel | grep -q 'static'

      - name: Upload panel binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smolofis-panel
          path: src-dashboard/target/x86_64-unknown-linux-musl/release/smolofis-panel
          if-no-files-found: error
          retention-days: 7

  build-iso:
    name: Assemble flashable ISO
    runs-on: ubuntu-latest
    needs: build-panel
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download panel binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smolofis-panel
          path: artifacts

      - name: Install image build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub2-common \
            mtools dosfstools file

      - name: Determine version label
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build ISO
        run: |
          chmod +x artifacts/smolofis-panel scripts/build-image.sh scripts/smolofis-firstboot.sh scripts/smolofis-install.sh scripts/smolofis-tailscale.sh scripts/smolofis-identity.sh scripts/smolofis-admin.sh scripts/smolofis-backup.sh scripts/smolofis-update.sh
          sudo --preserve-env=SMOLOFIS_VERSION scripts/build-image.sh \
            --binary artifacts/smolofis-panel \
            --version "${{ steps.version.outputs.version }}" \
            --precache-images \
            --keep-work \
            --output "dist/smolofis-${{ steps.version.outputs.version }}-amd64.iso"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM
        run: |
          sudo "${{ steps.syft.outputs.cmd }}" scan dir:work/rootfs \
            --output "spdx-json=dist/smolofis-${{ steps.version.outputs.version }}-amd64.spdx.json"
          sudo chmod a+r dist/*.spdx.json
          sudo rm -rf work

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smolofis-iso-${{ steps.version.outputs.version }}
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    name: Smoke-test ISO in QEMU
    runs-on: ubuntu-latest
    needs: build-iso
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smolofis-iso-${{ needs.build-iso.outputs.version }}
          # upload-artifact strips the common dist/ prefix, so the artifact
          # holds bare-named files; restore them under dist/ where the smoke
          # script and the publish steps expect them.
          path: dist

      - name: Install QEMU + tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso jq curl e2fsprogs qemu-utils
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

      - name: Boot the ISO and probe the panel
        run: |
          chmod +x scripts/smoke-test-iso.sh
          scripts/smoke-test-iso.sh \
            --iso "dist/smolofis-${{ needs.build-iso.outputs.version }}-amd64.iso" \
            --test-stack

      - name: Upload guest serial log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-test-serial-${{ needs.build-iso.outputs.version }}
          path: smoke-serial.log
          if-no-files-found: warn
          retention-days: 7

  install-test:
    name: Install to disk and reboot (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smolofis-iso-${{ needs.build-iso.outputs.version }}
          path: dist

      - name: Install QEMU + tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf expect sshpass curl openssh-client
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

      # UEFI upgrades from the last published nightly, the path a user would
      # take. BIOS covers a clean install of this build.
      - name: Download the previous nightly
        if: matrix.firmware == 'uefi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh release download nightly --pattern '*.iso' --output base/base.iso

      - name: Install the ISO, reboot, and assert persistence
        run: |
          chmod +x scripts/install-test-iso.sh
          base_args=()
          if [[ -f base/base.iso ]]; then
            base_args=(--base-iso base/base.iso)
          fi
          scripts/install-test-iso.sh \
            --iso "dist/smolofis-${{ needs.build-iso.outputs.version }}-amd64.iso" \
            --firmware "${{ matrix.firmware }}" \
            "${base_args[@]}"

  release:
    name: Publish ISO release
    runs-on: ubuntu-latest
    # Only publish images that booted, served the panel, and installed in CI.
    needs: [build-iso, smoke-test, install-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build-iso.outputs.version }}
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: smolofis-iso-${{ needs.build-iso.outputs.version }}
          # upload-artifact strips the common dist/ prefix, so the artifact
          # holds bare-named files; restore them under dist/ where the smoke
          # script and the publish steps expect them.
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.iso

      - name: Sign the release manifest
        env:
          RELEASE_KEY: ${{ secrets.SMOLOFIS_RELEASE_KEY }}
        run: |
          iso="smolofis-${VERSION}-amd64.iso"
          {
            echo "VERSION=${VERSION}"
            echo "ISO=${iso}"
            echo "SHA256=$(cut -d' ' -f1 "dist/${iso}.sha256")"
          } > dist/smolofis-manifest.txt
          key="$(mktemp)"
          trap 'rm -f "${key}"' EXIT
          printf '%s\n' "${RELEASE_KEY}" > "${key}"
          ssh-keygen -Y sign -f "${key}" -n smolofis-release dist/smolofis-manifest.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.iso
            dist/*.sha256
            dist/*.spdx.json
            dist/smolofis-manifest.txt
            dist/smolofis-manifest.txt.sig
          generate_release_notes: true

      # Updated in place so the nightly never disappears. The manifest goes up
      # after the ISO it names, and old versions are removed last.
      - name: Publish rolling nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload nightly dist/*.iso dist/*.sha256 dist/*.spdx.json --clobber
          gh release upload nightly dist/smolofis-manifest.txt dist/smolofis-manifest.txt.sig --clobber
          ls dist > current-assets.txt
          gh release view nightly --json assets --jq '.assets[].name' \
            | { grep -vFxf current-assets.txt || true; } \
            | xargs -r -n 1 gh release delete-asset nightly --yes
          gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nightly" -f "sha=${GITHUB_SHA}" -F force=true
          gh release edit nightly --notes "$(cat <<'EOF'
          Rolling build of the `main` branch.
          Flash with: `dd if=smolofis-*.iso of=/dev/sdX bs=4M status=progress conv=fsync`
          Then browse to **http://smolofis.local:8090** and run `sudo smolofis-install`.
          Verify a download with `gh attestation verify smolofis-*.iso --repo jcyrus/smolofis`.
          EOF
          )"
